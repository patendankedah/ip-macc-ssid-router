<script>
  // ============================================
  // KONFIGURASI
  // ============================================

  const API_URL =
    'https://script.google.com/macros/s/AKfycbyvXCS1Jqqeydvb5lj3UA5f5xzGbLg5nIwVDxV1KQe_MO1N9YkRAfVnBOo1A3I2wwn5/exec';

  const IP_PREFIX = '192.168.200.';

  // IP terakhir yang boleh digunakan.
  // .255 adalah broadcast, jadi gunakan .254 sebagai maksimum.
  const IP_MAX = 254;


  // ============================================
  // ELEMENT HTML
  // ============================================

  const dataBody    = document.getElementById('dataBody');
  const form        = document.getElementById('dataForm');
  const statusEl    = document.getElementById('status');

  const ipInput     = document.getElementById('IP');
  const ssidInput   = document.getElementById('SSID');
  const submitBtn   = document.getElementById('submitBtn');
  const maccInput   = document.getElementById('MACC');
  const refreshBtn  = document.getElementById('refreshBtn');
  const routerInput = document.getElementById('ROUTER');
  const routerList  = document.getElementById('routerList');

  let isLoading = false;


  // ============================================
  // STATUS
  // ============================================

  function showStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + type;
    statusEl.style.display = 'block';
  }


  // ============================================
  // FORMAT MAC ADDRESS
  // ============================================

  function formatMac(value) {
    let v = value
      .toUpperCase()
      .replace(/[^0-9A-F]/g, '');

    v = v.slice(0, 12);

    const parts = v.match(/.{1,2}/g) || [];

    return parts.join(':');
  }


  maccInput.addEventListener('input', () => {
    const formatted = formatMac(maccInput.value);

    maccInput.value = formatted;

    maccInput.selectionStart =
      maccInput.selectionEnd =
      formatted.length;
  });


  // ============================================
  // SSID OTOMATIS
  // ============================================

  function generateSSID(number) {
    return 'P.GEMILANG ' + number;
  }


  // ============================================
  // AMBIL NOMOR IP
  // ============================================

  function getIPNumber(ip) {
    if (!ip) return null;

    const value = String(ip).trim();

    // Pastikan menggunakan prefix yang benar
    if (!value.startsWith(IP_PREFIX)) {
      return null;
    }

    const parts = value.split('.');

    if (parts.length !== 4) {
      return null;
    }

    const number = parseInt(parts[3], 10);

    if (isNaN(number)) {
      return null;
    }

    return number;
  }


  // ============================================
  // CARI IP TERBESAR
  // ============================================

  function findHighestIP(allData) {

    let highest = 0;
    let highestRow = null;

    allData.forEach(row => {

      const ipNumber = getIPNumber(row.IP);

      if (ipNumber === null) {
        return;
      }

      if (ipNumber > highest) {
        highest = ipNumber;
        highestRow = row;
      }

    });

    return {
      number: highest,
      row: highestRow
    };
  }


  // ============================================
  // UPDATE DAFTAR ROUTER
  // ============================================

  function updateRouterList(allData) {

    const routers = allData
      .map(row => row.ROUTER)
      .filter(
        r =>
          typeof r === 'string' &&
          r.trim() !== ''
      );

    const uniqueRouters = [
      ...new Set(routers)
    ];

    routerList.innerHTML = '';

    uniqueRouters.forEach(router => {

      const option =
        document.createElement('option');

      option.value = router;

      routerList.appendChild(option);

    });
  }


  // ============================================
  // LOAD DATA DARI GOOGLE SHEET
  // ============================================

  async function loadData() {

    try {

      dataBody.innerHTML =
        '<tr>' +
        '<td colspan="4" style="text-align:center;">' +
        'Memuat data...' +
        '</td>' +
        '</tr>';


      // ------------------------------------------
      // AMBIL DATA
      // ------------------------------------------

      const res = await fetch(API_URL);

      if (!res.ok) {
        throw new Error(
          'HTTP ' + res.status
        );
      }


      const json = await res.json();


      if (!Array.isArray(json)) {

        throw new Error(
          'Data dari Google Sheet bukan array.'
        );

      }


      const allData = json;


      // ------------------------------------------
      // UPDATE ROUTER
      // ------------------------------------------

      updateRouterList(allData);


      // ------------------------------------------
      // JIKA BELUM ADA DATA
      // ------------------------------------------

      if (allData.length === 0) {

        dataBody.innerHTML =
          '<tr>' +
          '<td colspan="4" style="text-align:center;">' +
          'Belum ada data.' +
          '</td>' +
          '</tr>';

        ipInput.value =
          IP_PREFIX + '1';

        ssidInput.value =
          generateSSID(1);

        routerInput.value = '';

        submitBtn.disabled = false;

        return;
      }


      // ------------------------------------------
      // CARI IP TERBESAR
      // ------------------------------------------

      const highest =
        findHighestIP(allData);


      const highestNumber =
        highest.number;

      const highestRow =
        highest.row;


      // ------------------------------------------
      // JIKA TIDAK ADA IP YANG VALID
      // ------------------------------------------

      if (!highestRow) {

        dataBody.innerHTML =
          '<tr>' +
          '<td colspan="4" style="text-align:center;">' +
          'Data ada, tetapi tidak ditemukan IP ' +
          IP_PREFIX +
          '</td>' +
          '</tr>';

        ipInput.value =
          IP_PREFIX + '1';

        ssidInput.value =
          generateSSID(1);

        submitBtn.disabled = false;

        return;
      }


      // ------------------------------------------
      // DATA TERAKHIR / TERBESAR
      // ------------------------------------------

      const lastIP =
        IP_PREFIX + highestNumber;

      const lastSSID =
        highestRow.SSID || '';

      const lastRouter =
        highestRow.ROUTER || '';


      // ------------------------------------------
      // TAMPILKAN DATA TERBESAR
      // ------------------------------------------

      dataBody.innerHTML = `
        <tr>
          <td>${highestRow.IP || '-'}</td>
          <td>${highestRow.MACC || '-'}</td>
          <td>${highestRow.SSID || '-'}</td>
          <td>${highestRow.ROUTER || '-'}</td>
        </tr>
      `;


      // ------------------------------------------
      // ROUTER DEFAULT
      // ------------------------------------------

      routerInput.value = lastRouter;


      // ------------------------------------------
      // HITUNG IP BERIKUTNYA
      // ------------------------------------------

      const nextNumber =
        highestNumber + 1;


      // ------------------------------------------
      // CEK BATAS MAKSIMUM
      // ------------------------------------------

      if (nextNumber <= IP_MAX) {

        const nextIP =
          IP_PREFIX + nextNumber;


        // ----------------------------------------
        // ISI IP OTOMATIS
        // ----------------------------------------

        ipInput.value =
          nextIP;


        // ----------------------------------------
        // ISI SSID OTOMATIS
        // ----------------------------------------

        ssidInput.value =
          generateSSID(nextNumber);


        // ----------------------------------------
        // AKTIFKAN TOMBOL
        // ----------------------------------------

        submitBtn.disabled = false;


        // ----------------------------------------
        // DEBUG
        // ----------------------------------------

        console.log(
          '================================'
        );

        console.log(
          'Jumlah data        :',
          allData.length
        );

        console.log(
          'IP terbesar        :',
          lastIP
        );

        console.log(
          'Nomor IP terbesar  :',
          highestNumber
        );

        console.log(
          'IP berikutnya      :',
          nextIP
        );

        console.log(
          'SSID berikutnya    :',
          ssidInput.value
        );

        console.log(
          'Router terakhir    :',
          lastRouter
        );

        console.log(
          '================================'
        );

      } else {

        // ----------------------------------------
        // SUDAH MAKSIMAL
        // ----------------------------------------

        ipInput.value =
          lastIP;

        ssidInput.value =
          lastSSID;

        submitBtn.disabled = true;

        showStatus(
          'IP sudah mencapai maksimal (' +
          IP_MAX +
          ').',
          'warn'
        );

      }


    } catch (err) {

      console.error(
        'Gagal memuat data:',
        err
      );


      dataBody.innerHTML = `
        <tr>
          <td colspan="4"
              style="text-align:center;color:#b91c1c;">
            Gagal memuat data:
            ${err.message}
          </td>
        </tr>
      `;

      showStatus(
        'Gagal mengambil data dari Google Sheet: ' +
        err.message,
        'err'
      );

    }

  }


  // ============================================
  // REFRESH
  // ============================================

  refreshBtn.addEventListener(
    'click',
    () => {

      loadData();

    }
  );


  // ============================================
  // SUBMIT FORM
  // ============================================

  form.addEventListener(
    'submit',
    async (e) => {

      e.preventDefault();


      if (isLoading) {
        return;
      }


      isLoading = true;

      submitBtn.disabled = true;


      showStatus(
        'Mengirim data...',
        'info'
      );


      // ------------------------------------------
      // AMBIL DATA FORM
      // ------------------------------------------

      const IP =
        ipInput.value.trim();

      const MACC =
        maccInput.value.trim();

      const SSID =
        ssidInput.value.trim();

      const ROUTER =
        routerInput.value.trim();


      // ------------------------------------------
      // VALIDASI
      // ------------------------------------------

      if (
        !IP ||
        !MACC ||
        !SSID ||
        !ROUTER
      ) {

        showStatus(
          'Semua field wajib diisi.',
          'err'
        );

        isLoading = false;

        submitBtn.disabled = false;

        return;
      }


      // ------------------------------------------
      // VALIDASI MAC
      // ------------------------------------------

      const macPattern =
        /^([0-9A-F]{2}:){5}[0-9A-F]{2}$/;


      if (!macPattern.test(MACC)) {

        showStatus(
          'Format MAC Address tidak valid.',
          'err'
        );

        isLoading = false;

        submitBtn.disabled = false;

        return;
      }


      try {

        // ----------------------------------------
        // SIAPKAN DATA
        // ----------------------------------------

        const body =
          new URLSearchParams();

        body.append(
          'IP',
          IP
        );

        body.append(
          'MACC',
          MACC
        );

        body.append(
          'SSID',
          SSID
        );

        body.append(
          'ROUTER',
          ROUTER
        );


        // ----------------------------------------
        // KIRIM KE GOOGLE APPS SCRIPT
        // ----------------------------------------

        await fetch(
          API_URL,
          {
            method: 'POST',

            mode: 'no-cors',

            headers: {
              'Content-Type':
                'application/x-www-form-urlencoded;charset=UTF-8'
            },

            body: body
          }
        );


        // ----------------------------------------
        // BERHASIL DIKIRIM
        // ----------------------------------------

        showStatus(
          'Data dikirim. Memperbarui data...',
          'ok'
        );


        // Kosongkan MAC
        maccInput.value = '';


        // ----------------------------------------
        // TUNGGU SEBENTAR LALU LOAD ULANG
        // ----------------------------------------

        setTimeout(
          () => {

            loadData();

          },
          1000
        );


      } catch (err) {

        showStatus(
          'Gagal mengirim data: ' +
          err.message,
          'err'
        );

      } finally {

        isLoading = false;

        // Jangan langsung aktifkan jika
        // loadData() nanti menentukan sudah .254
        setTimeout(
          () => {

            if (
              ipInput.value &&
              getIPNumber(ipInput.value) < IP_MAX
            ) {

              submitBtn.disabled = false;

            }

          },
          1200
        );

      }

    }
  );


  // ============================================
  // JALANKAN SAAT HALAMAN DIBUKA
  // ============================================

  loadData();

</script>
